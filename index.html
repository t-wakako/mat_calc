<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>マット穴位置計算</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      background: #f5f5f5;
      color: #222;
      font-family: -apple-system, BlinkMacSystemFont,
        "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 10px #00000012;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 23px;
    }

    .description {
      margin: 0 0 20px;
      color: #666;
      font-size: 14px;
    }

    .field {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(110px, 150px);
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .field label {
      font-size: 15px;
    }

    input {
      width: 100%;
      min-width: 0;
      padding: 11px 10px;
      border: 1px solid #bbb;
      border-radius: 7px;
      font-size: 16px;
      background: white;
      color: #222;
    }

    input:focus {
      outline: 2px solid #5795df;
      border-color: #5795df;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 22px 0;
    }

    button {
      min-height: 46px;
      padding: 10px 16px;
      border: 0;
      border-radius: 8px;
      background: #2468b4;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      touch-action: manipulation;
    }

    button.secondary {
      background: #526477;
    }

    button:active {
      opacity: 0.8;
    }

    .result {
      padding: 16px;
      margin-bottom: 20px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #fafafa;
    }

    .result h2 {
      margin: 0 0 12px;
      font-size: 18px;
    }

    .result-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .result-item {
      padding: 12px;
      background: white;
      border: 1px solid #e5e5e5;
      border-radius: 7px;
    }

    .result-item span {
      display: block;
      margin-bottom: 5px;
      color: #555;
      font-size: 13px;
    }

    .result-item strong {
      font-size: 20px;
      overflow-wrap: anywhere;
    }

    .error {
      display: none;
      margin: 12px 0;
      padding: 12px;
      color: #b00020;
      background: #fff0f0;
      border-radius: 7px;
      font-size: 14px;
    }

    .preview-title {
      margin: 0 0 10px;
      font-size: 18px;
    }

    .preview {
      width: 100%;
      min-height: 300px;
      height: min(70vh, 540px);
      background: #f4f4f4;
      border: 1px solid #ddd;
      border-radius: 8px;
      overflow: hidden;
    }

    .preview svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .note {
      margin-top: 14px;
      color: #555;
      font-size: 13px;
      line-height: 1.7;
    }

    @media (max-width: 480px) {
      body {
        padding: 8px;
      }

      .container {
        padding: 14px;
        border-radius: 8px;
      }

      h1 {
        font-size: 21px;
      }

      .field {
        grid-template-columns: minmax(0, 1fr) minmax(100px, 42%);
        gap: 8px;
      }

      .field label {
        font-size: 14px;
      }

      .buttons {
        display: grid;
        grid-template-columns: 1fr;
      }

      button {
        width: 100%;
      }

      .result-grid {
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .result-item {
        padding: 10px;
      }

      .result-item strong {
        font-size: 18px;
      }

      .preview {
        height: 400px;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>マット穴位置計算</h1>
    <p class="description">
      マット寸法・窓寸法またはイメージ寸法を入力してください（mm）
    </p>

    <form id="calcForm">
      <div class="field">
        <label for="inputMode">寸法の指定方法</label>
        <select id="inputMode" style="width:100%;padding:11px 10px;border:1px solid #bbb;border-radius:7px;font-size:16px;background:white;color:#222">
          <option value="window">窓寸法を直接指定</option>
          <option value="image">イメージ寸法から指定（窓寸法＝イメージ寸法＋余白×2）</option>
        </select>
      </div>
      <div class="field">
        <label for="longSide">マット寸法の縦（mm）</label>
        <input id="longSide" type="number"
          value="457" min="1" step="any" required>
      </div>

      <div class="field">
        <label for="shortSide">マット寸法の横（mm）</label>
        <input id="shortSide" type="number"
          value="559" min="1" step="any" required>
      </div>

      <div id="windowDimensionFields">
        <div class="field">
          <label for="cutVertical">窓寸法の縦（mm）</label>
          <input id="cutVertical" type="number" value="278" min="1" step="any" required>
        </div>
        <div class="field">
          <label for="cutHorizontal">窓寸法の横（mm）</label>
          <input id="cutHorizontal" type="number" value="351" min="1" step="any" required>
        </div>
      </div>

      <div id="imageDimensionFields" hidden>
        <div class="field">
          <label for="imageVertical1">イメージ縦寸法（1）（mm）</label>
          <input id="imageVertical1" type="number" value="258" min="1" step="any">
        </div>
        <div class="field">
          <label for="imageVertical2">イメージ縦寸法（2）（mm）</label>
          <input id="imageVertical2" type="number" value="258" min="1" step="any">
        </div>
        <div class="field">
          <label for="imageHorizontal1">イメージ横寸法（1）（mm）</label>
          <input id="imageHorizontal1" type="number" value="331" min="1" step="any">
        </div>
        <div class="field">
          <label for="imageHorizontal2">イメージ横寸法（2）（mm）</label>
          <input id="imageHorizontal2" type="number" value="331" min="1" step="any">
        </div>
        <div class="field">
          <label for="imageMargin">イメージの余白（mm）(-30～30)</label>
          <input id="imageMargin" type="number" value="10" min="-30" max="30" step="any">
        </div>
      </div>

      <div class="field">
        <label for="ratio">偏芯率（0.30上～0.50中央～0.70下）</label>
        <input id="ratio" type="number"
          value="0.45" min="0.30" max="0.70" step="0.01" required>
      </div>

      <div class="buttons">
        <button type="button" class="secondary"
          id="centerButton">
          窓を中央に開ける（偏芯率0.50）
        </button>
        <button type="submit">計算する</button>
      </div>
    </form>

    <div id="error" class="error" role="alert"></div>

    <section class="result" aria-live="polite">
      <h2>計算結果</h2>
      <div class="result-grid">
        <div class="result-item">
          <span>縦方向の偏芯率</span>
          <strong id="outRatio">0.450</strong>
        </div>
        <div class="result-item">
          <span>窓上 A（mm）</span>
          <strong id="outA">80.55</strong>
        </div>
        <div class="result-item">
          <span>窓左 C（mm）</span>
          <strong id="outC">104.00</strong>
        </div>
        <div class="result-item">
          <span>窓下（mm）</span>
          <strong id="outBottom">98.45</strong>
        </div>
        <div class="result-item">
          <span>窓右（mm）</span>
          <strong id="outRight">104.00</strong>
        </div>
      </div>
    </section>

    <h2 class="preview-title">マット・窓位置プレビュー</h2>
    <div class="preview" id="preview">
      <svg id="drawing"
        xmlns="http://www.w3.org/2000/svg"
        role="img"
        aria-label="マットと窓の位置関係を示す図">
        <text x="50%" y="50%" text-anchor="middle"
          fill="#666">計算結果を表示します</text>
      </svg>
    </div>

    <p class="note">
      A：上端から窓までの位置<br>
      C：左端から窓までの位置<br>
      青い窓の内側に、イメージを模式図（山と太陽）で表示します。<br>
      イメージ寸法指定モード(余白あり)では、入力した縦・横それぞれの大きい寸法を図に反映します。<br>
      イメージ寸法指定モード(余白なし)では、入力した縦・横それぞれの小さい寸法を図に反映します。<br>
      寸法の単位は mm です。<br>
    </p>
  </main>

  <script>
    "use strict";

    const $ = id => document.getElementById(id);

    let lastResult = null;

    function updateImageDimensions() {
      const L = Number($("longSide").value);
      const S = Number($("shortSide").value);
      // 入力値をマット寸法の範囲に制限
      for (const id of ["imageVertical1", "imageVertical2"]) {
        $(id).max = Number.isFinite(L) && L > 0 ? String(L) : "";
      }
      for (const id of ["imageHorizontal1", "imageHorizontal2"]) {
        $(id).max = Number.isFinite(S) && S > 0 ? String(S) : "";
      }
    }

    function updateInputMode() {
      const imageMode = $("inputMode").value === "image";
      $("windowDimensionFields").hidden = imageMode;
      $("imageDimensionFields").hidden = !imageMode;
      $("cutVertical").required = !imageMode;
      $("cutHorizontal").required = !imageMode;
      for (const id of ["imageVertical1", "imageVertical2", "imageHorizontal1", "imageHorizontal2", "imageMargin"]) {
        $(id).required = imageMode;
      }
      updateImageDimensions();
    }

    function calculate() {
      $("error").style.display = "none";
      updateImageDimensions();

      const fields = [
        ["longSide", "マット寸法の縦"],
        ["shortSide", "マット寸法の横"],
        ["ratio", "偏芯率"]
      ];
      const values = {};
      for (const [id, name] of fields) {
        const input = $(id);
        const value = input.value.trim() === "" ? NaN : Number(input.value);
        if (!Number.isFinite(value)) throw new Error(name + " は数値で入力してください。");
        values[id] = value;
      }

      const L = values.longSide;
      const S = values.shortSide;
      const R = values.ratio;
      let V, H;

      if (L <= 1 || S <= 1) {
        throw new Error("マット寸法は1より大きくしてください。");
      }

      if ($("inputMode").value === "image") {
        const imageFields = [
          ["imageVertical1", "イメージ縦寸法（1）", L],
          ["imageVertical2", "イメージ縦寸法（2）", L],
          ["imageHorizontal1", "イメージ横寸法（1）", S],
          ["imageHorizontal2", "イメージ横寸法（2）", S]
        ];
        const iv = {}, ih = {};
        for (const [id, name, max] of imageFields) {
          const raw = $(id).value.trim();
          const value = raw === "" ? NaN : Number(raw);
          if (!Number.isFinite(value) || value < 1 || value > max) {
            throw new Error(name + "は1～" + max + "mmの範囲で入力してください。");
          }
          if (id.startsWith("imageVertical")) iv[id] = value;
          else ih[id] = value;
        }
        const imageMarginRaw = $("imageMargin").value.trim();
        const imageMargin = imageMarginRaw === "" ? NaN : Number(imageMarginRaw);
        if (!Number.isFinite(imageMargin) || imageMargin < -30 || imageMargin > 30) {
          throw new Error("イメージの余白は-30～+30mmの範囲で入力してください。");
        }
        const imageV = imageMargin < 0
          ? Math.min(iv.imageVertical1, iv.imageVertical2)
          : Math.max(iv.imageVertical1, iv.imageVertical2);
        const imageH = imageMargin < 0
          ? Math.min(ih.imageHorizontal1, ih.imageHorizontal2)
          : Math.max(ih.imageHorizontal1, ih.imageHorizontal2);
        // 余白は上下・左右それぞれに加算するため、指定値の2倍を窓寸法に加える
        V = imageV + imageMargin * 2;
        H = imageH + imageMargin * 2;
      } else {
        for (const [id, name] of [["cutVertical", "窓寸法の縦"], ["cutHorizontal", "窓寸法の横"]]) {
          const raw = $(id).value.trim();
          const value = raw === "" ? NaN : Number(raw);
          if (!Number.isFinite(value) || value <= 0) throw new Error(name + "は0より大きい数値で入力してください。");
          values[id] = value;
        }
        V = values.cutVertical;
        H = values.cutHorizontal;
      }

      if (R < 0.30 || R > 0.70) throw new Error("偏芯率は0.30～0.70の範囲で入力してください。");
      if (V <= 0 || H <= 0) {
        throw new Error("窓寸法は0mmより大きくなるように、イメージの余白を指定してください。");
      }
      if (V > L || H > S) {
        throw new Error("窓寸法の縦横がマット寸法の縦横より大きくなっています。イメージ寸法と余白を調整してください。");
      }

      const A = (L - V) * R;
      const C = (S - H) * 0.5;
      const bottom = L - A - V;
      const right = S - C - H;
      lastResult = { L, S, V, H, R, A, C, bottom, right };
      $("outRatio").textContent = R.toFixed(3);
      $("outA").textContent = A.toFixed(2);
      $("outC").textContent = C.toFixed(2);
      $("outBottom").textContent = bottom.toFixed(2);
      $("outRight").textContent = right.toFixed(2);
      drawPreview();
    }

    function drawPreview() {
      if (!lastResult) return;

      const { L, S, V, H, A, C } = lastResult;
      const imageMode = $("inputMode").value === "image";
      // 余白が負の場合は四辺寸法の小さい方、0以上の場合は大きい方を図に使用
      const margin = imageMode ? Number($("imageMargin").value) : 10;
      const imageV = imageMode
        ? (margin < 0 ? Math.min(Number($("imageVertical1").value), Number($("imageVertical2").value)) : Math.max(Number($("imageVertical1").value), Number($("imageVertical2").value)))
        : Math.max(1, V - 20);
      const imageH = imageMode
        ? (margin < 0 ? Math.min(Number($("imageHorizontal1").value), Number($("imageHorizontal2").value)) : Math.max(Number($("imageHorizontal1").value), Number($("imageHorizontal2").value)))
        : Math.max(1, H - 20);
      const svg = $("drawing");
      const rect = svg.getBoundingClientRect();

      const width = rect.width;
      const height = rect.height;

      if (width <= 0 || height <= 0) return;

      const pad = 35;
      const scale = Math.min(
        (width - pad * 2) / S,
        (height - pad * 2) / L
      );

      if (scale <= 0) return;

      const mw = S * scale;
      const mh = L * scale;
      const ox = (width - mw) / 2;
      const oy = (height - mh) / 2;

      const x = ox + C * scale;
      const y = oy + A * scale;
      const w = H * scale;
      const h = V * scale;
      // 窓の中にイメージを中央配置して表示
      const iw = Math.min(H, imageH) * scale;
      const ih = Math.min(V, imageV) * scale;
      const ix = x + (w - iw) / 2;
      const iy = y + (h - ih) / 2;
      const iconPad = Math.min(iw, ih) * 0.12;
      const sunR = Math.max(2, Math.min(iw, ih) * 0.07);

      // SVG座標系を画面サイズに合わせる
      svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
      svg.setAttribute("preserveAspectRatio", "none");

      svg.innerHTML = `
        <rect
          x="${ox}" y="${oy}"
          width="${mw}" height="${mh}"
          fill="burlywood"
          stroke="black" stroke-width="1.5"
        />
        <rect
          x="${x}" y="${y}"
          width="${w}" height="${h}"
          fill="#eef5fb"
          stroke="#2468b4" stroke-width="1.5"
        />
        <rect
          x="${ix}" y="${iy}"
          width="${iw}" height="${ih}"
          rx="1" fill="#fff" stroke="#8998a8" stroke-width="1.2"
        />
        <g aria-label="イメージの図">
          <circle cx="${ix + iw * 0.76}" cy="${iy + ih * 0.25}" r="${sunR}" fill="#b8d5e8" />
          <path d="M ${ix + iconPad} ${iy + ih * 0.82} L ${ix + iw * 0.38} ${iy + ih * 0.42} L ${ix + iw * 0.56} ${iy + ih * 0.62} L ${ix + iw * 0.68} ${iy + ih * 0.49} L ${ix + iw - iconPad} ${iy + ih * 0.82} Z" fill="#c8ddeb" />
          <path d="M ${ix + iconPad} ${iy + ih * 0.82} L ${ix + iw * 0.38} ${iy + ih * 0.42} L ${ix + iw * 0.56} ${iy + ih * 0.62} L ${ix + iw * 0.68} ${iy + ih * 0.49} L ${ix + iw - iconPad} ${iy + ih * 0.82}" fill="none" stroke="#9dbed4" stroke-width="1" />
        </g>
        <g fill="#222"
           font-family="sans-serif"
           font-size="13">
          <text x="8" y="20">A = ${A.toFixed(2)} mm</text>
          <text x="8" y="39">C = ${C.toFixed(2)} mm</text>
        </g>
        <g font-family="sans-serif" font-size="11" fill="#334155">
          <text x="${ox + 6}" y="${oy + mh + 18}">マット</text>
          <text x="${Math.max(8, x)}" y="${Math.max(12, y - 5)}" fill="#2468b4">窓</text>
        </g>
      `;
    }

    function showError(error) {
      $("error").textContent = error.message;
      $("error").style.display = "block";
    }

    $("inputMode").addEventListener("change", () => {
      updateInputMode();
      try { calculate(); } catch (error) { showError(error); }
    });

    for (const id of ["longSide", "shortSide", "imageVertical1", "imageVertical2", "imageHorizontal1", "imageHorizontal2"]) {
      $(id).addEventListener("input", updateImageDimensions);
    }

    $("calcForm").addEventListener("submit", event => {
      event.preventDefault();

      try {
        calculate();
      } catch (error) {
        showError(error);
      }
    });

    $("centerButton").addEventListener("click", () => {
      $("ratio").value = "0.50";

      try {
        calculate();
      } catch (error) {
        showError(error);
      }
    });

    // 画面の回転やブラウザ幅の変更に対応
    if ("ResizeObserver" in window) {
      new ResizeObserver(() => drawPreview())
        .observe($("preview"));
    } else {
      window.addEventListener("resize", drawPreview);
    }

    // 初期表示
    updateInputMode();
    try {
      calculate();
    } catch (error) {
      showError(error);
    }
  </script>
</body>
</html>
